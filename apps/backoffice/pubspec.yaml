name: backoffice
description: Staff backoffice for lesson requests and professor verification.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  api_client:
    path: ../../packages/api_client
  blocs:
    path: ../../packages/blocs
  domain:
    path: ../../packages/domain
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_secure_storage: 11.2.0
  go_router: 18.0.2
  ui:
    path: ../../packages/ui
  use_cases:
    path: ../../packages/use_cases

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
