name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Test domain
        working-directory: packages/domain
        run: dart test
