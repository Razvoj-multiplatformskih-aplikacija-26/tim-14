name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: domain
            command: dart test
          - package: ui
            command: flutter test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: ${{ matrix.command }}
