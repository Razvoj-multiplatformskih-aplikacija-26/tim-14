name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: domain
            command: dart test
          - package: ui
            command: flutter test
          - package: use_cases
            command: dart test
          - package: blocs
            command: dart test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      # dart test exits 79 when there are no tests, so a package that has none
      # yet gets a warning instead of a red build.
      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ -z "$(find test -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
            echo "::warning::packages/${{ matrix.package }} has no tests yet"
            exit 0
          fi
          ${{ matrix.command }}
